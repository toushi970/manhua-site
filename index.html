<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Premium Manhua Reader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>📖 My Manhua Reader</h1>
  </header>

  <!-- WELCOME SECTION (ANIME GIRL) -->
  <div class="welcome">
    <img src="welcome.png" alt="Welcome Anime Girl">
    <div class="welcome-text">
      <h2>Welcome, Reader ✨</h2>
      <p>Select a chapter and enjoy your manhua experience</p>
    </div>
  </div>

  <div class="genres">
    <button onclick="filterGenre('all')">All</button>
    <button onclick="filterGenre('action')">Action</button>
    <button onclick="filterGenre('romance')">Romance</button>
    <button onclick="filterGenre('fantasy')">Fantasy</button>
    <button onclick="filterGenre('horror')">Horror</button>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="container">

    <aside>
      <h2>Manhua List</h2>

      <ul>
        <li onclick="loadChapter('manhua1', 1)">Manhua 1 - Ch 1</li>
        <li onclick="loadChapter('manhua1', 2)">Manhua 1 - Ch 2</li>
        <li onclick="loadChapter('manhua2', 1)">Manhua 2 - Ch 1</li>
      </ul>
    </aside>

    <!-- READER AREA -->
    <main id="reader">
      <h2>Start Reading</h2>
      <p>Choose a chapter from the left panel</p>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
