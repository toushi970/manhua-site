<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Premium Manhua Reader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>📖 My Manhua Reader</h1>
  </header>

  <!-- WELCOME SECTION (ANIME GIRL) -->
  <div class="welcome">
    <img src="welcome.png" alt="Welcome Anime Girl">
    <div class="welcome-text">
      <h2>Welcome, Reader ✨</h2>
      <p>Select a chapter and enjoy your manhua experience</p>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="container">

    <!-- SIDEBAR -->
    <aside>
      <h2>Chapters</h2>
      <ul>
        <li onclick="loadChapter(1)">Chapter 1</li>
        <li onclick="loadChapter(2)">Chapter 2</li>
      </ul>
    </aside>

    <!-- READER AREA -->
    <main id="reader">
      <h2>Start Reading</h2>
      <p>Choose a chapter from the left panel</p>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
