<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manhua Library</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>📚 Manhua Library</h1>
</header>

<!-- HERO / WELCOME -->
<div class="welcome">
  <img src="welcome.png" alt="Welcome">
  <div class="welcome-text">
    <h2>Welcome Reader ✨</h2>
    <p>Choose a manhua to start reading</p>
  </div>
</div>

<!-- GRID LIBRARY -->
<div class="grid">

  <div class="card" onclick="openManhua('manhua1')">
    <img src="cover1.jpg">
    <h3>Manhua 1</h3>
  </div>

  <div class="card" onclick="openManhua('manhua2')">
    <img src="cover2.jpg">
    <h3>Manhua 2</h3>
  </div>

</div>

<!-- CHAPTER VIEW -->
<div id="reader" class="reader"></div>

<script src="script.js"></script>
</body>
</html>
