<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Manhua Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📖 My Manhua Reader</h1>
  </header>

  <div class="container">

    <!-- Sidebar -->
    <aside>
      <h2>Chapters</h2>
      <ul>
        <li onclick="loadChapter(1)">Chapter 1</li>
        <li onclick="loadChapter(2)">Chapter 2</li>
      </ul>
    </aside>

    <!-- Reader -->
    <main id="reader">
      <h2>Select a chapter</h2>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
